{{- with site.Params.giscus }}
{{- if .repoId }}
<section class="giscus-comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async></script>
  <script>
    // Keep giscus in sync with PaperMod's light/dark toggle.
    (function () {
      const root = document.documentElement;
      const theme = () => (root.dataset.theme === "dark" ? "dark" : "light");
      const send = () => {
        const frame = document.querySelector("iframe.giscus-frame");
        frame && frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme() } } }, "https://giscus.app");
      };
      window.addEventListener("message", (e) => { if (e.origin === "https://giscus.app") send(); }, { once: true });
      new MutationObserver(send).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    })();
  </script>
</section>
{{- end }}
{{- end }}
