baseURL = "https://faiface.github.io/"
locale = "en-us"
title = "faiface blog"

enableRobotsTXT = true

# No post uses tags or categories, so don't generate any pages or feeds for them.
disableKinds = ["taxonomy", "term"]

# Old links must keep working: posts have always lived at /post/<file-name>/.
[permalinks]
  post = "/post/:contentbasename/"

# RSS at /index.xml and /post/index.xml, the same paths as the old site.
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = -1

[markup.highlight]
  noClasses = false

[params]
  author = "Michal Štrba"
  description = "Posts on programming and programming languages."

  # New comments live in GitHub Discussions on this repo, via giscus (https://giscus.app).
  [params.giscus]
    repo = "faiface/faiface.github.io"
    repoId = "MDEwOlJlcG9zaXRvcnk5OTM4MzY2Nw=="
    category = "Comments"
    categoryId = "DIC_kwDOBex5c84DIjk7"

[menus]
  [[menus.main]]
    name = "All posts"
    pageRef = "/post"
    weight = 10
  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 20
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/faiface"
    weight = 30
