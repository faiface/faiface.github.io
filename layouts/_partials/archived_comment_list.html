{{- with where .all "parent" .parent }}
<ol class="archived-comment-list">
  {{- range . }}
  <li class="archived-comment" id="comment-{{ .id }}">
    <div class="archived-comment-meta">
      <span class="archived-comment-author">{{ .author }}</span>
      {{- with .date }} · <time datetime="{{ . }}">{{ time.AsTime . | time.Format "January 2, 2006" }}</time>{{ end }}
    </div>
    <div class="archived-comment-body">{{ .message | safeHTML }}</div>
    {{- partial "archived_comment_list.html" (dict "all" $.all "parent" .id) }}
  </li>
  {{- end }}
</ol>
{{- end }}
