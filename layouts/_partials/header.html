{{- /* Full masthead on the front page and lists; a compact one on posts so the article leads. */ -}}
<header class="masthead{{ if .IsPage }} masthead--compact{{ end }}">
  <div class="wrap">
    <div class="masthead-top">
      <a class="masthead-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></g></svg>
      </button>
    </div>
    <nav class="masthead-nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
